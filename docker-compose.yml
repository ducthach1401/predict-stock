version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: ${MYSQL_CONTAINER:-predict-stock-mysql}
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-predict_stock}
      MYSQL_TEST_DATABASE: ${MYSQL_TEST_DATABASE:-predict_stock_test}
      MYSQL_APP_USER: ${MYSQL_APP_USER:-predict_app}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?set MYSQL_APP_PASSWORD in .env}
      MYSQL_MIGRATOR_USER: ${MYSQL_MIGRATOR_USER:-predict_migrator}
      MYSQL_MIGRATOR_PASSWORD: ${MYSQL_MIGRATOR_PASSWORD:?set MYSQL_MIGRATOR_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - predict_stock_mysql:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  # The app: the paper-trading scheduler (daily job, backup, weekly restore test). One-off commands reuse this definition:
  #   docker-compose run --rm app python -m predict_stock paper status        (deploy.sh wraps all of this)
  app:
    build: .
    image: predict-stock:latest
    container_name: ${APP_CONTAINER:-predict-stock-app}
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    depends_on:
      - mysql
    env_file: .env
    environment:
      MYSQL_HOST: mysql   # inside the compose network the database is `mysql:3306`, whatever port .env publishes on the host
      MYSQL_PORT: "3306"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./reports:/app/reports
      - ./backups:/app/backups
      - ./logs:/app/logs
      - ./docs:/app/docs
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /app/logs/.scheduler_heartbeat) )) -lt 900"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  predict_stock_mysql:
