# Default configuration. Snapshotted into job_runs.config_snapshot on every run.
# No secrets here: DB credentials come from environment / .env.

seed: 42

# ---- Vietnam market constraints (principle 8) ------------------------------
# DEFAULTS FROM THE PROJECT BRIEF / GENERAL KNOWLEDGE, NOT VERIFIED against the
# current HOSE/HNX rulebook or your broker's fee schedule. Re-check before
# trusting any backtest that uses them.
market:
  long_only: true
  lot_size: 100
  settlement_days: 2            # T+2 for the underlying shares
  fee_rate: 0.0015              # per side
  sell_tax_rate: 0.001          # sell side only
  slippage_rate: 0.001
  price_limit_pct:              # daily price band by exchange
    HOSE: 0.07
    HNX: 0.10
    UPCOM: 0.15
  default_exchange: HOSE
  # HOSE tick size for stocks, prices in VND: [lower bound inclusive, tick]
  band_inference_window: 252    # exchange history is unknown: the daily band is inferred from the trailing 252 sessions of returns
  tick_size_vnd:
    - [0, 10]
    - [10000, 50]
    - [50000, 100]

# ---- DNSE public market-data endpoint ---------------------------------------
# UNDOCUMENTED by DNSE; verified only by probing (see docs/DNSE_API_NOTES.md).
dnse:
  base_url: https://api.dnse.com.vn/chart-api/v2/ohlcs
  timeout_s: 30
  min_interval_s: 0.2           # client-side throttle; real server limit unknown
  max_retries: 4
  backoff_base_s: 1.0
  user_agent: "Mozilla/5.0 (predict-stock research client)"
  price_multiplier_stock: 1000  # API quotes stock prices in thousand VND
  price_multiplier_index: 1     # index levels are points
  resolution: "1D"
  bar_timezone: Asia/Ho_Chi_Minh

# ---- Universes (codes are data, see `universe apply`) ---------------------------------
universe:
  training_code: LARGE50        # instruments the models train on (normally the wider set)
  trading_code: LARGE50         # instruments allowed to receive recommendations (must be a subset)
  history_floor: "2000-01-01"   # symbol history of instruments with unknown listing date starts here

# ---- Ingestion ----------------------------------------------------------------
ingest:
  history_start: "2018-01-01"
  # Incremental runs re-fetch this many calendar days before the last stored
  # bar and compare closes; a mismatch means DNSE re-adjusted history.
  overlap_calendar_days: 21
  adjust_rel_tolerance: 0.0005
  # Today's bar is only accepted after close + buffer (avoid partial bars).
  session_close_time: "15:00"
  final_bar_buffer_minutes: 15
  min_sessions: 500             # daily sessions needed before an instrument is usable for training
  auto_backfill: true           # `universe apply` backfills newly added instruments
  intraday:                     # optional 1H bars (DNSE serves them from 2023-09-21 only)
    enabled: false
    resolution: "1H"
    history_start: "2023-09-01"
    overlap_calendar_days: 5
  calendar_code: VN_CONSENSUS
  # Trading days = dates on which at least this fraction of the stocks that are
  # "active" (between their first and last stored bar) have a bar. Derived from
  # stocks, not from an index series: DNSE's VNINDEX series misses ~33 real trading days.
  calendar_min_stock_fraction: 0.5
  calendar_grace_days: 30       # a stock counts as active this long after its last bar (a lone stray bar cannot make a trading day)
  benchmark_symbols: [VNINDEX, VN30]

# ---- Data-quality thresholds ----------------------------------------------------
quality:
  big_move_tolerance: 0.01      # flag |ret| > limit + this
  return_outlier_z: 8.0         # robust z (median/MAD) of daily log returns; real data max was 9.9
  volume_spike_ratio: 30.0      # volume / prior 60-session median
  volume_spike_window: 60
  price_range_vnd: [500, 5000000]
  unit_jump_ratio: 100.0        # day-over-day ratio beyond this either way = probable unit change
  report_path: docs/DATA_QUALITY.md
  known_issues_path: data/quality_known_issues.csv

adjustments:
  gap_tolerance: 0.01           # open/prev_close gap beyond (band + this) = corporate-action candidate
  detect_max_band: true         # exchange history unknown -> widest band (UPCoM 15%): only large events are visible

# ---- Features / datasets (Phase 3) ---------------------------------------------------------------
features:
  definitions_path: config/feature_sets.yaml
  benchmark_symbol: VN30          # DNSE has VN30 only from 2020-05-11: relative strength / downside beta are NaN before that
  benchmark_fallback_symbol: null # e.g. VNINDEX to fill 2018-2020 (rescaled to agree on the first VN30 date); off by default
  benchmark_ffill_limit: 5
  fundamentals:
    enabled: false                # price data only; a FundamentalProvider can be plugged in later

datasets:
  dir: artifacts/datasets
  audit_lookahead: true           # every build proves features do not use data after t
  audit_cuts: 3
  require_ready: true             # instruments blocked for insufficient history at the end date are left out

# ---- Backtest (Phase 4) ---------------------------------------------------------------------------
backtest:
  capital: 1000000000           # VND
  start: "2019-03-01"           # INVEST features need ~274 sessions of warm-up
  oos_months: 12                # the last 12 months are HELD OUT: not touched by any development run, revealed once
  top_k: 10
  max_weight: 0.15
  rebalance_threshold: 0.20     # skip a position change smaller than 20% of the TARGET position value (a convention, not tuned)
  tie: stop_first               # both barriers inside one bar: the stop is taken first
  risk_free_annual: 0.0
  cost_multipliers: [0.0, 0.5, 1.0, 2.0, 3.0]   # of fee, tax and slippage; 0 = before costs, 1 = the configured costs
  regime_window: 126
  regime_threshold: 0.10
  wf_train_sessions: 500
  wf_test_sessions: 250
  wf_embargo_sessions: 10
  benchmark_symbols: [VNINDEX, VN30]
  report_path: docs/BASELINES.md
  image_dir: docs/img
  artifacts_dir: artifacts/backtests

# ---- SWING model (Phase 5) ------------------------------------------------------------------------------
swing:
  feature_set: "swing:1"
  label_spec: "swing:1"
  rank_target: fwd_rank_5        # rank score: cross-sectional rank of the 5-session forward return
  return_target: fwd_ret_5       # q10 / q50 / q90 of the 5-session forward return
  event_label: tb_label          # event = target touched before the stop within `horizon` sessions (tb_label == 1)
  hold_column: tb_time
  horizon: 10
  quantiles: [0.1, 0.5, 0.9]
  n_estimators: 600
  early_stopping_rounds: 50
  calibration: isotonic
  isotonic_min_bin: 150          # added after the first run showed isotonic outputs of 1.0 in 3 folds (see docs/SWING.md)
  seed: 42
  num_threads: 4
  folds: {scheme: expanding, train_min_sessions: 500, test_sessions: 125, step_sessions: 125, embargo_sessions: 10, val_sessions: 125}
  optuna: {trials: 25, seed: 42, timeout_s: 1200}     # ONE study on the training/validation data of the first fold; the result is frozen
  strategy: {top_k: 10, rebalance: weekly, barrier_target_mult: 2.0, barrier_stop_mult: 1.0, barrier_max_hold: 10, min_prob_multiple: 1.0, max_positions: 10}
  # PRE-REGISTERED decision rule (also stored in `experiments` before training). The held-out period is opened ONLY if all hold.
  decision: {min_ic_tstat: 2.0, min_positive_fold_share: 0.6, stress_cost_multiple: 2.0}
  # reported for information only; NEVER used to choose the configuration
  sensitivity_k: [5, 10, 20]
  sensitivity_min_prob: [0.0, 1.0, 1.25, 1.5]
  sensitivity_atr: [[2.0, 1.0], [3.0, 1.5], [1.5, 1.0], [4.0, 2.0]]
  artifacts_dir: artifacts/models
  report_path: docs/SWING.md
