[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predict-stock"
version = "0.1.0"
description = "Research + paper-trading recommendation system for Vietnamese equities (SWING / INVEST)"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "pymysql>=1.1",
    "cryptography>=42",  # MySQL 8 caching_sha2_password auth for pymysql
    "pandas>=2.2",
    "requests>=2.31",
    "pydantic>=2.6",
    "pyyaml>=6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -ra"
markers = [
    "live: hits the real DNSE public endpoint (run with -m live)",
]
